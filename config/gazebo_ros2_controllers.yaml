/**:
  controller_manager:
    ros__parameters:
      update_rate: 250
      use_sim_time: true

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      left_fr3_arm_controller:
        type: joint_trajectory_controller/JointTrajectoryController

      right_fr3_arm_controller:
        type: joint_trajectory_controller/JointTrajectoryController

      left_franka_gripper:
        type: position_controllers/GripperActionController

      right_franka_gripper:
        type: position_controllers/GripperActionController

  joint_state_broadcaster:
    ros__parameters:
      use_local_topics: true

  left_fr3_arm_controller:
    ros__parameters:
      command_interfaces:
        - position
      state_interfaces:
        - position
        - velocity
      joints:
        - left_fr3_joint1
        - left_fr3_joint2
        - left_fr3_joint3
        - left_fr3_joint4
        - left_fr3_joint5
        - left_fr3_joint6
        - left_fr3_joint7

  right_fr3_arm_controller:
    ros__parameters:
      command_interfaces:
        - position
      state_interfaces:
        - position
        - velocity
      joints:
        - right_fr3_joint1
        - right_fr3_joint2
        - right_fr3_joint3
        - right_fr3_joint4
        - right_fr3_joint5
        - right_fr3_joint6
        - right_fr3_joint7

  left_franka_gripper:
    ros__parameters:
      joint: left_fr3_finger_joint1
      goal_tolerance: 0.001
      allow_stalling: true
      stall_velocity_threshold: 0.001
      stall_timeout: 1.0

  right_franka_gripper:
    ros__parameters:
      joint: right_fr3_finger_joint1
      goal_tolerance: 0.001
      allow_stalling: true
      stall_velocity_threshold: 0.001
      stall_timeout: 1.0
